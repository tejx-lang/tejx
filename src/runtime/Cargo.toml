[package]
name = "tejx-rt"
version = "2.0.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "rlib"]
path = "core/lib.rs"

[dependencies]
crossbeam-deque = "0.8.8"
hmac      = "0.12.1"
libc      = "0.2.183"
mio = { version = "1.2.3", features = ["os-poll", "net"] }
native-tls = "0.2.18"
once_cell = "1.21.4"
pbkdf2    = "0.12.2"
rand      = "0.8.5"
sha2      = "0.10.8"
